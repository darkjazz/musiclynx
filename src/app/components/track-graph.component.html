<svg width="960" height="800" #graph></svg>
<div *ngIf="graphLoaded" class="legend">
  <div class="legend-title">Similar Tracks By</div>
  <div><span class="dot" style="background:#1565c0"></span>Timbre</div>
  <div><span class="dot" style="background:#2e7d32"></span>Rhythm</div>
  <div><span class="dot" style="background:#e65100"></span>Tonal</div>
  <div><span class="dot" style="background:#6a1b9a"></span>Combined</div>
</div>
<div *ngIf="groupName" class="grouplabel" [style.color]="groupColor">{{ groupName }}</div>
