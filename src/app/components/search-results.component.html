<spinner *ngIf="showSpinner"></spinner>
<div *ngIf="!showSpinner" id="search-results">
  <p *ngIf="showNoResults" class="no-results">No results for '{{ term }}'</p>

  <div *ngIf="artists.length > 0" class="result-section">
    <h3 class="section-label">Artists</h3>
    <ul class="result-list">
      <li *ngFor="let artist of artists" (click)="gotoArtist(artist)" class="result-item">
        <span class="result-name">{{ artist.name }}</span>
        <span *ngIf="artist.disambiguation" class="result-meta">{{ artist.disambiguation.substring(0, 80) }}</span>
      </li>
    </ul>
  </div>

  <div *ngIf="tracks.length > 0" class="result-section">
    <h3 class="section-label">Tracks</h3>
    <ul class="result-list">
      <li *ngFor="let track of tracks" (click)="gotoTrack(track)" class="result-item">
        <span class="result-name">{{ track.title }}</span>
        <span class="result-meta">{{ track.artist }}<span *ngIf="track.album_name"> — {{ track.album_name }}</span></span>
        <span *ngIf="track.length_seconds" class="result-dur">{{ formatDuration(track.length_seconds) }}</span>
      </li>
    </ul>
  </div>
</div>
