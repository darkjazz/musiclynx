<spinner *ngIf="showSpinner"></spinner>
<div *ngIf="!showSpinner">
  <h2>{{artist.name}}</h2>
  <div>
    <div *ngIf="artist.abstract" class="abstract"> {{ artist.abstract }}</div>
    <div class="player">
      <!-- <div class="artist_image"><img *ngIf="artist.image" [src]="artist.image"></div> -->
      <player *ngIf="deezer_id"
        [playing]="isPlaying"
        [cover]="cover"
        [title]="title"
        (play)="play()"
        (pause)="pause()"
        (stop)="stop()"
        (next)="next()"
        (previous)="previous()"
      >
      </player>
    </div>
    <div *ngIf="artist.community" class="community-section">
      <div class="community-row">
        <span class="meta-label">MusicLynx Community</span>
        <span class="genre-chip">{{ artist.community.name }}</span>
      </div>
      <div *ngIf="artist.genres?.length" class="genres-row">
        <span class="meta-label">Inferred genres</span>
        <span *ngFor="let g of artist.genres" class="genre-chip">{{ g }}</span>
      </div>
    </div>
    <div><label>Find {{ artist.name }} on </label></div>
    <ul class="links">
      <li><div *ngIf="artist.wikipedia_uri"><a target="_blank" [href]="artist.wikipedia_uri"><img src="./assets/wiki.png"></a></div></li>
      <li><div *ngIf="artist.id" class="mbid"><a target="_blank" [href]="'http://musicbrainz.org/artist/'+artist.id"><img src="./assets/musicbrainz.png"></a></div></li>
      <li><div *ngIf="artist.dbpedia_uri" class="mbid"><a target="_blank" [href]="artist.dbpedia_uri"><img src="./assets/dbpedia.png"></a></div></li>
      <li><div *ngIf="artist.name" class="mbid"><a target="_blank" [href]="'https://www.youtube.com/results?search_query='+artist.name"><img src="./assets/youtube.png"></a></div></li>
    </ul>
  </div>

  <artist-graph *ngIf="showGraph()"
    [setArtist]="artist">
  </artist-graph>

  <div *ngIf="mbTracks" class="track-list">
    <h3>Tracks in audio database</h3>
    <ul>
      <li *ngFor="let t of mbTracks" (click)="goToTrack(t)" class="track-item">
        <span class="track-title">{{ t.title }}</span>
        <span *ngIf="t.album_name" class="track-album"> — {{ t.album_name }}</span>
        <span *ngIf="t.length_seconds" class="track-dur">{{ formatDuration(t.length_seconds) }}</span>
      </li>
    </ul>
  </div>
  <div *ngIf="showGrid()">
    <category-links *ngIf="artist.associated_artists"
      [setCategory]="artist.associated_artists"
      [setArtist]="artist">
    </category-links>
    <category-links *ngFor="let category of artist.categories"
      [setCategory]="category"
      [setArtist]="artist">
    </category-links>
    <category-links *ngFor="let category of ab_categories"
      [setCategory]="category"
      [setArtist]="artist">
    </category-links>
    <category-links *ngIf="mood_category"
      [setCategory]="mood_category"
      [setArtist]="artist">
    </category-links>
    <category-links *ngIf="lastfm_category"
      [setCategory]="lastfm_category"
      [setArtist]="artist">
    </category-links>
  </div>
  <!-- <youtube-videos *ngIf="videos"
    [setArtist]="artist"
    [setVideos]="videos">
  </youtube-videos> -->
  <!-- <button (click)="goBack()">Back</button> -->
</div>
